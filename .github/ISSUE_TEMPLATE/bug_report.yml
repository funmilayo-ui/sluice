name: Bug report
description: Something does not work as the README or the app says it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problem? Do not file it here. Follow [SECURITY.md](https://github.com/funmilayo-ui/sluice/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got. Paste exact error text.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: A request (`curl` against `/v1/...`), the asset pair and amount, or steps in the web app.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where
      options: [API, Web app, SDK, Core (routing / quotes), Execution (build / submit), Contract, Docs, Other]
    validations:
      required: true
  - type: input
    id: venue
    attributes:
      label: Venue, if relevant
      placeholder: classic-path, aquarius, soroswap, phoenix, comet, blend
  - type: input
    id: env
    attributes:
      label: Environment
      description: Node version, browser and wallet for web issues, and whether you used the public RPC or your own.
  - type: input
    id: tx
    attributes:
      label: Transaction hash, if one exists
